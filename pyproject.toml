[project]
name = "localquant"
version = "0.1.0"
description = "本地投研工作站"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pandas>=2.0.0",
    "numpy",
    "pandas-ta>=0.3.14b",
    "pydantic>=2.0.0",
    "duckdb>=1.0.0",
    "quantstats>=0.0.62",
    "statsmodels>=0.14.0",
    "alphalens-reloaded>=0.4.6",
    "aiosqlite>=0.20.0",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",
    "sse-starlette>=2.0.0",
    "httpx>=0.27.0",
    "pyarrow>=17.0.0",
    "openai>=1.0.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "pydantic-settings>=2.0.0",
    "lightgbm>=4.3.0",
    "xgboost>=2.0.0",
    "torch>=2.2.0",
    "psutil>=7.2.2",
    "comfyui-frontend-package==1.47.10",
    "python-multipart>=0.0.32",
    "ruff>=0.16.0",
    # 代码执行沙箱（OpenSandbox 客户端/SDK）：回测信号代码容器隔离执行。
    # 实际隔离还需本机 Docker Desktop + opensandbox-server（make sandbox-server）；
    # 二者未就绪时自动降级为进程内执行（见 backend/services/sandbox.py）。
    "opensandbox>=0.1.15",
    "opensandbox-code-interpreter>=0.1.2",
]
